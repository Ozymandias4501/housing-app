[project]
name = "housing-app"
version = "0.1.0"
description = "Colorado housing market dashboard: data pipeline, ML models, API, and frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package dir (src/housing) doesn't match the project name (housing-app),
# so hatchling needs to be told where the package lives.
[tool.hatch.build.targets.wheel]
packages = ["src/housing"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Defaults (E pycodestyle, F pyflakes) plus import sorting, pyupgrade, and bugbear.
select = ["E", "F", "I", "UP", "B"]
