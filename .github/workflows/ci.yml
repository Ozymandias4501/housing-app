name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels the run still going for the older commit — only the
# tip of a branch is worth a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Exact version, not a floating major: setup-uv stopped publishing `vN`
      # alias tags after v7, so `@v10` doesn't resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # No python-version here on purpose: uv reads .python-version, so the
      # pinned version lives in exactly one place and can't drift.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
